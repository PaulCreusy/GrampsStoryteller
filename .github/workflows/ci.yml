name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q tests

  gramps:
    name: Tests with Gramps ${{ matrix.gramps }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gramps: ["5.1.6", "5.2.4", "6.0.4"]
    steps:
      - uses: actions/checkout@v4
      - name: Install GObject introspection
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 python3-venv
      - name: Prepare Gramps sources
        env:
          GRAMPS_VERSION: ${{ matrix.gramps }}
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install orjson pytest
          GRAMPS_DIR="$RUNNER_TEMP/gramps-$GRAMPS_VERSION"
          case "$GRAMPS_VERSION" in
            5.1.*)
              # Gramps 5.1 is not published on PyPI
              git clone --depth 1 --branch "v$GRAMPS_VERSION" \
                https://github.com/gramps-project/gramps.git "$GRAMPS_DIR"
              ;;
            *)
              "$RUNNER_TEMP/venv/bin/pip" download --no-deps --no-binary :all: \
                "gramps==$GRAMPS_VERSION" -d "$RUNNER_TEMP"
              tar xzf "$RUNNER_TEMP/gramps-$GRAMPS_VERSION.tar.gz" -C "$RUNNER_TEMP"
              # Gramps 5.2 finds its resources next to the sources only in a
              # git checkout
              mkdir -p "$GRAMPS_DIR/.git"
              ;;
          esac
      - name: Run tests
        run: |
          export PYTHONPATH="$RUNNER_TEMP/gramps-${{ matrix.gramps }}"
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q -p no:logging tests

  addon:
    name: Addon package and translations are up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the translations are complete
        run: python scripts/i18n.py check
      - run: python scripts/i18n.py update
      - run: python scripts/build_addon.py
      - name: Check that the committed package and translations match the sources
        run: |
          git status --porcelain addons po
          git diff --exit-code addons po
          test -z "$(git status --porcelain addons po)"
